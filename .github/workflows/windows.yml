name: Compilar Windows

on:
  push:
    branches: [main, master]
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        shell: bash
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Versión según el número de compilación
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version

      - name: Instalar dependencias
        run: npm install

      - name: Compilar app (solo la carpeta, sin portable)
        run: npx electron-builder --win dir --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Instalador (Inno Setup)
        shell: pwsh
        working-directory: windows
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=1.0.${{ github.run_number }}" installer\claudeck.iss
          if ($LASTEXITCODE -ne 0) { throw "Falló Inno Setup" }

      - uses: actions/upload-artifact@v4
        with:
          name: Claudeck-Windows
          path: windows/dist/AlternAIs-Setup-*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Borrar artifacts anteriores
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.workflow_run.id != ${{ github.run_id }}) | select(.name == "Claudeck-Windows") | .id' |
          while read -r id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done
