name: Compilar Android

on:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Tests unitarios
        working-directory: android
        continue-on-error: true
        run: gradle testDebugUnitTest --no-daemon

      - name: Subir reporte de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tests-Android
          path: android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

      - name: Compilar APK
        run: gradle assembleRelease --no-daemon

      - name: Renombrar APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Claudeck-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Claudeck-Android
          path: android/out/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Borrar artifacts anteriores
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.workflow_run.id != ${{ github.run_id }}) | select(.name == "Claudeck-Android") | .id' |
          while read -r id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done
