<!doctype html>
<!-- Animación de arranque de AlternAIs (Windows nativo). splash.js es copia EXACTA de windows/renderer/splash.js:
     si se cambia uno, copiar el otro (y Splash.kt de Android). La app la carga en un WebView2 encima de la ventana. -->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1c1917; }
  #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #1c1917; cursor: default; }
  .splash-svg { width: min(54vh, 54vw, 480px); height: auto; overflow: visible; }
</style>
</head>
<body>
<div id="splash" aria-hidden="true"></div>
<script src="splash.js"></script>
<script>
  (function () {
    var sent = false;
    function done() {
      if (sent) return;
      sent = true;
      try { window.chrome.webview.postMessage('done'); } catch (_) {}
    }
    // splash.js quita #splash al terminar (~1,7 s), al tocarla o de entrada si se pidieron menos animaciones.
    if (!document.getElementById('splash')) { done(); return; }
    document.addEventListener('click', done);
    var poll = setInterval(function () {
      if (!document.getElementById('splash')) { clearInterval(poll); done(); }
    }, 50);
    setTimeout(done, 2500);
  })();
</script>
</body>
</html>
